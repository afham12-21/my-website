<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Products</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: #222;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin-bottom: 8px;
    }

    #products {
      width: 90%;
      max-width: 1200px;
      margin: 30px auto;

      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: contain;
      margin-bottom: 15px;
    }

    .card h2 {
      font-size: 18px;
      margin-bottom: 10px;
      height: 45px;
      overflow: hidden;
    }

    .category {
      color: #777;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .price {
      color: #e63946;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .rating {
      color: #f4a261;
      margin-bottom: 10px;
    }

    .description {
      color: #555;
      font-size: 14px;
      line-height: 1.5;
      height: 65px;
      overflow: hidden;
    }

    .loading {
      text-align: center;
      font-size: 22px;
      margin-top: 50px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🛒 My Store</h1>
    <p>Products from Afham Web</p>
  </header>

  <div id="products">
    <p class="loading">Loading products...</p>
  </div>


  <script>
    fetch('https://fakestoreapi.com/products')
      .then(response => response.json())
      .then(data => {

        const productsContainer = document.getElementById('products');

        productsContainer.innerHTML = '';

        data.forEach(product => {

          const card = document.createElement('div');
          card.classList.add('card');

          card.innerHTML = `
            <img src="${product.image}" alt="${product.title}">

            <h2>${product.title}</h2>

            <p class="category">
              Category: ${product.category}
            </p>

            <p class="price">
              $${product.price}
            </p>

            <p class="rating">
              ⭐ ${product.rating.rate} 
              (${product.rating.count} reviews)
            </p>

            <p class="description">
              ${product.description}
            </p>
          `;

          productsContainer.appendChild(card);
        });

      })
      .catch(error => {
        document.getElementById('products').innerHTML =
          '<p class="loading">Products Could Not Be Loaded.</p>';

        console.error(error);
      });
  </script>

</body>
</html>
